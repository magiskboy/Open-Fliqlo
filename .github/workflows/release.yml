name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: cd apps/open_fliqlo && flutter pub get

      - name: Analyze
        run: |
          cd packages/fliqlo_core && flutter analyze
          cd ../fliqlo_ui && flutter analyze
          cd ../../apps/open_fliqlo && flutter analyze

      - name: Test
        run: |
          cd packages/fliqlo_core && flutter test
          cd ../fliqlo_ui && flutter test
          cd ../../apps/open_fliqlo && flutter test

  build-linux:
    name: Linux
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/open_fliqlo
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release

      - name: Package
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ARTIFACT_BASE="OpenFliqlo-linux-x64-${TAG}"
          BUNDLE="apps/open_fliqlo/build/linux/x64/release/bundle"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/$ARTIFACT_BASE"
          cp -a "$BUNDLE/." "$STAGE/$ARTIFACT_BASE/"
          cp packaging/linux/open-fliqlo-screensaver.desktop "$STAGE/$ARTIFACT_BASE/" || true
          cp packaging/linux/idle-launch-screensaver.sh "$STAGE/$ARTIFACT_BASE/" || true
          printf '%s\n' \
            'Open Fliqlo (Linux)' \
            "Version: ${TAG}" \
            'Run:           ./open_fliqlo' \
            'Screensaver:   ./open_fliqlo --screensaver' \
            > "$STAGE/$ARTIFACT_BASE/README-linux.txt"
          mkdir -p dist
          tar -C "$STAGE" -czf "dist/${ARTIFACT_BASE}.tar.gz" "$ARTIFACT_BASE"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  build-windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: flutter config --enable-windows-desktop
      - working-directory: apps/open_fliqlo
        run: flutter pub get

      - name: Build Flutter Windows + SCR
        shell: pwsh
        run: .\platforms\windows_scr\build.ps1

      - name: Zip package
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $base = "OpenFliqlo-windows-x64-$tag"
          $src = Join-Path $env:GITHUB_WORKSPACE "dist\windows-screensaver"
          $outDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $zip = Join-Path $outDir "$base.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path (Join-Path $src "*") -DestinationPath $zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/OpenFliqlo-windows-x64-*.zip
          if-no-files-found: error

  build-android:
    name: Android
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/open_fliqlo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Package
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp apps/open_fliqlo/build/app/outputs/flutter-apk/app-release.apk \
            "dist/OpenFliqlo-android-${TAG}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  build-ios:
    name: iOS
    needs: test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/open_fliqlo
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build ipa --release --no-codesign

      - name: Package IPA
        working-directory: apps/open_fliqlo
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          OUT_DIR="${{ github.workspace }}/dist"
          mkdir -p "$OUT_DIR"
          ARTIFACT="OpenFliqlo-ios-unsigned-${TAG}.ipa"

          if compgen -G "build/ios/ipa/*.ipa" > /dev/null; then
            cp build/ios/ipa/*.ipa "$OUT_DIR/$ARTIFACT"
          elif [[ -d build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app ]]; then
            STAGE="$(mktemp -d)"
            mkdir -p "$STAGE/Payload"
            cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app \
              "$STAGE/Payload/Runner.app"
            (cd "$STAGE" && zip -r -q "$OUT_DIR/$ARTIFACT" Payload)
            rm -rf "$STAGE"
          elif [[ -d build/ios/iphoneos/Runner.app ]]; then
            STAGE="$(mktemp -d)"
            mkdir -p "$STAGE/Payload"
            cp -R build/ios/iphoneos/Runner.app "$STAGE/Payload/Runner.app"
            (cd "$STAGE" && zip -r -q "$OUT_DIR/$ARTIFACT" Payload)
            rm -rf "$STAGE"
          else
            echo "No IPA or Runner.app found"
            find build/ios -maxdepth 4 -type d 2>/dev/null || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.ipa
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: find release-assets -type f | sort

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Open Fliqlo ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Artifacts

            | File | Platform |
            |---|---|
            | `OpenFliqlo-linux-x64-*.tar.gz` | Linux desktop (+ screensaver helpers) |
            | `OpenFliqlo-windows-x64-*.zip` | Windows app + `OpenFliqlo.scr` |
            | `OpenFliqlo-android-*.apk` | Android (debug-keystore signed until release key is set) |
            | `OpenFliqlo-ios-unsigned-*.ipa` | iOS unsigned — not installable without Ad Hoc signing |

            See [docs/ci.md](docs/ci.md) for install notes.
          files: |
            release-assets/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
