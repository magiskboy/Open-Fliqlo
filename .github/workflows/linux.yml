name: Linux build

on:
  workflow_dispatch:

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/open_fliqlo

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libglib2.0-bin zip

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Pub get
        run: flutter pub get

      - name: Build release
        run: flutter build linux --release

      - name: Package tar.gz + extension zip
        id: package
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          REF_NAME="${GITHUB_REF_NAME:-manual}"
          SHA_SHORT="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          ARTIFACT_BASE="OpenFliqlo-linux-x64-${REF_NAME}-${SHA_SHORT}"
          BUNDLE="apps/open_fliqlo/build/linux/x64/release/bundle"
          EXT_ZIP_NAME="open-fliqlo-lockscreen@openfliqlo.shell-extension.zip"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/$ARTIFACT_BASE/gnome-extension"
          cp -a "$BUNDLE/." "$STAGE/$ARTIFACT_BASE/"
          cp packaging/linux/open-fliqlo-screensaver.desktop "$STAGE/$ARTIFACT_BASE/" || true
          cp packaging/linux/idle-launch-screensaver.sh "$STAGE/$ARTIFACT_BASE/" || true
          ./platforms/gnome_shell_extension/pack.sh "$STAGE/$ARTIFACT_BASE/gnome-extension"
          cp platforms/gnome_shell_extension/install.sh "$STAGE/$ARTIFACT_BASE/gnome-extension/"
          printf '%s\n' \
            'Open Fliqlo (Linux)' \
            '-------------------' \
            'Run:           ./open_fliqlo' \
            'Screensaver:   ./open_fliqlo --screensaver' \
            'Idle helper:   OPEN_FLIQLO_BIN=$PWD/open_fliqlo ./idle-launch-screensaver.sh' \
            'Lock screen:   gnome-extensions install gnome-extension/'"${EXT_ZIP_NAME}" \
            '               (then enable; set binary path to this folder'\''s ./open_fliqlo)' \
            'Docs:          https://github.com/openfliqlo/open-fliqlo (docs/lockscreen-gnome.md)' \
            > "$STAGE/$ARTIFACT_BASE/README-linux.txt"
          mkdir -p artifacts
          tar -C "$STAGE" -czf "artifacts/${ARTIFACT_BASE}.tar.gz" "$ARTIFACT_BASE"
          cp "$STAGE/$ARTIFACT_BASE/gnome-extension/${EXT_ZIP_NAME}" "artifacts/${EXT_ZIP_NAME}"
          echo "artifact_base=${ARTIFACT_BASE}" >> "$GITHUB_OUTPUT"
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_base }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.shell-extension.zip
          if-no-files-found: error
          retention-days: 30
