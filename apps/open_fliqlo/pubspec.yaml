name: open_fliqlo
description: Open Fliqlo — cross-platform fullscreen flip clock.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  fliqlo_core:
    path: ../../packages/fliqlo_core
  fliqlo_ui:
    path: ../../packages/fliqlo_ui
  shared_preferences: ^2.5.3
  wakelock_plus: ^1.3.2
  window_manager: ^0.5.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/flip.wav
