name: open_fliqlo
repository: https://github.com/openfliqlo/open-fliqlo

packages:
  - apps/**
  - packages/**

command:
  bootstrap:
    environment:
      sdk: ">=3.5.0 <4.0.0"

scripts:
  analyze:
    run: melos exec -- flutter analyze
    description: Run flutter analyze in all packages
  test:
    run: melos exec --dir-exists=test -- flutter test
    description: Run tests in all packages
  run:linux:
    run: cd apps/open_fliqlo && flutter run -d linux
    description: Run Open Fliqlo on Linux
  run:windows:
    run: cd apps/open_fliqlo && flutter run -d windows
    description: Run Open Fliqlo on Windows
  run:screensaver:linux:
    run: cd apps/open_fliqlo && flutter run -d linux -a --screensaver
    description: Run Open Fliqlo in screensaver mode on Linux
  build:windows-scr:
    run: bash platforms/windows_scr/build.sh
    description: Build Flutter Windows release + OpenFliqlo.scr (needs Windows/.NET for SCR host)
  build:ios-ipa:
    run: cd apps/open_fliqlo && flutter build ipa --release --no-codesign
    description: Build unsigned iOS IPA (macOS + Xcode only)
