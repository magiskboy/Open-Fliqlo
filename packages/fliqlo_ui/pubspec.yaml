name: fliqlo_ui
description: Flip clock widgets and theme for Open Fliqlo.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  fliqlo_core:
    path: ../fliqlo_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  fonts:
    - family: Fliqlo
      fonts:
        - asset: fonts/gluqlo.ttf
